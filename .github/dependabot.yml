version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["actions/*"]
      gradle:
        patterns: ["gradle/*"]
      third-party:
        patterns: ["*"]
        exclude-patterns: ["actions/*", "gradle/*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]

  # Rust workspace (Cargo.lock at the root). The MSRV-aware resolver and the
  # msrv-check CI job catch updates that need a newer Rust than the minimum.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies", "rust"]

  # Android app: version catalog, Gradle plugins and the Gradle wrapper.
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "weekly"
    groups:
      android-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies", "android"]
